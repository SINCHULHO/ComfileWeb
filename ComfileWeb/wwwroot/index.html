<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ComfileWeb</title>
    <script>
        (function () {
            // ComfileWeb 편집 전용 모드 플래그.
            // 호스트(WebView2)가 없어도 배포 런타임으로 자동 진입하지 않고
            // 브라우저 디자이너 편집 화면을 유지한다.
            window.comfileWebEditorMode = true;
            var isWebViewHost = !!(window.chrome && window.chrome.webview);
            if (!isWebViewHost) {
                document.documentElement.classList.add('comfileweb-editor');
            }
        })();
    </script>
    <link rel="stylesheet" href="visualization.css" />
</head>
<body>
    <div class="designer">
        <header class="logo-bar" aria-label="ComfileWEB logo bar">
            <div class="toolbar-logo" aria-label="ComfileWEB logo">ComfileWEB</div>
        </header>
        <header class="toolbar" aria-label="Visualization toolbar">
            <button id="comfilewebOpenButton" class="toolbar-button comfileweb-open-button" type="button">열기</button>
            <button id="comfilewebSaveButton" class="toolbar-button comfileweb-save-button" type="button">저장</button>
            <button class="toolbar-button run-button" type="button" data-i18n="run">실행</button>
            <button id="deployWebServerButton" class="toolbar-button deploy-webserver-button" type="button" style="display:none">웹서버 배포</button>
            <div class="division-tools" aria-label="Grid division tools">
                <label class="division-control division-control-back">
                    <span data-i18n="color">Color</span>
                    <button id="pageBackColorButton" class="toolbar-color-button" type="button" aria-label="Page background color">
                        <span id="pageBackColorSwatch" class="toolbar-color-swatch"></span>
                    </button>
                </label>
                <span class="division-separator" aria-hidden="true"></span>
                <label class="division-control division-control-grid">
                    <span data-i18n="grid">Grid</span>
                    <input id="gridVisibleCheckbox" type="checkbox" checked />
                </label>
                <span class="division-separator" aria-hidden="true"></span>
                <label class="division-control division-control-theme">
                    <span data-i18n="theme">Theme</span>
                    <select id="themeModeSelect" class="toolbar-select" aria-label="Theme mode">
                        <option value="dark" selected>Dark</option>
                        <option value="light">Light</option>
                    </select>
                </label>
                <span class="division-separator" aria-hidden="true"></span>
                <label class="division-control division-control-language">
                    <span data-i18n="language">Language</span>
                    <select id="languageModeSelect" class="toolbar-select" aria-label="Language mode">
                        <option value="en">English</option>
                        <option value="ko" selected>Korean</option>
                    </select>
                </label>
                <span class="division-separator" aria-hidden="true"></span>
                <div class="align-tools" aria-label="Alignment tools">
                    <button id="alignTopButton" class="align-tool icon-align-top" type="button" title="위 맞춤" aria-label="위 맞춤"></button>
                    <button id="alignBottomButton" class="align-tool icon-align-bottom" type="button" title="아래 맞춤" aria-label="아래 맞춤"></button>
                    <button id="alignLeftButton" class="align-tool icon-align-left" type="button" title="왼쪽 맞춤" aria-label="왼쪽 맞춤"></button>
                    <button id="alignRightButton" class="align-tool icon-align-right" type="button" title="오른쪽 맞춤" aria-label="오른쪽 맞춤"></button>
                    <button id="distributeHorizontalButton" class="align-tool icon-distribute-horizontal" type="button" title="가로 간격 균등" aria-label="가로 간격 균등"></button>
                    <button id="distributeVerticalButton" class="align-tool icon-distribute-vertical" type="button" title="세로 간격 균등" aria-label="세로 간격 균등"></button>
                    <button id="matchSizeButton" class="align-tool icon-match-size" type="button" title="크기 맞춤" aria-label="크기 맞춤"></button>
                    <button id="arrayDuplicateButton" class="align-tool icon-array-duplicate" type="button" title="배열복제" aria-label="배열복제"></button>
                </div>
            </div>
            <div class="toolbar-spacer" aria-hidden="true"></div>
            <div class="split-sliders" aria-label="X/Y grid sliders">
                <label class="division-control">
                    <span>X</span>
                    <input id="gridXSlider" type="range" min="5" max="49" value="49" />
                    <span id="gridXValue" class="division-value">49</span>
                </label>
                <span class="division-separator" aria-hidden="true"></span>
                <label class="division-control">
                    <span>Y</span>
                    <input id="gridYSlider" type="range" min="5" max="30" value="30" />
                    <span id="gridYValue" class="division-value">30</span>
                </label>
            </div>
        </header>
        <div class="main-layout">
            <aside class="widget-palette" aria-label="Widget palette">
                <div class="widget-palette-title" data-i18n="widgets">위젯</div>
                <div class="widget-tools" aria-label="Widget tools">
                    <button class="widget-tool icon-button" type="button" title="Button" aria-label="Button" draggable="true" data-widget-kind="Button"><span>Button</span></button>
                    <button class="widget-tool icon-lamp" type="button" title="Lamp" aria-label="Lamp" draggable="true" data-widget-kind="Lamp"><span>Lamp</span></button>
                    <button class="widget-tool icon-toggle" type="button" title="Toggle" aria-label="Toggle" draggable="true" data-widget-kind="Toggle"><span>Toggle</span></button>
                    <button class="widget-tool icon-number" type="button" title="Number" aria-label="Number" draggable="true" data-widget-kind="Number"><span>Number</span></button>
                    <button class="widget-tool icon-text" type="button" title="Text" aria-label="Text" draggable="true" data-widget-kind="Text"><span>Text</span></button>
                    <button class="widget-tool icon-slider" type="button" title="Slider" aria-label="Slider" draggable="true" data-widget-kind="Slider"><span>Slider</span></button>
                    <button class="widget-tool icon-progress" type="button" title="ProgressBar" aria-label="ProgressBar" draggable="true" data-widget-kind="ProgressBar"><span>Progress</span></button>
                    <button class="widget-tool icon-gauge" type="button" title="Gauge" aria-label="Gauge" draggable="true" data-widget-kind="Gauge"><span>Gauge</span></button>
                </div>
            </aside>
            <main class="work-area">
                <div class="canvas-shell">
                    <div class="canvas-header" aria-label="현재 페이지">
                        <div id="activePageLabel" class="active-page-label">Page1</div>
                    </div>
                    <div id="designSurface" class="design-surface" aria-label="시각화 디자인 영역">
                        <p class="placeholder" data-i18n="placeholder">원하는 부품(버튼, 램프등)을 마우스로 끌어다 이곳에 놓으세요</p>
                    </div>
                </div>
            </main>
            <div id="propertySplitter" class="property-splitter" title="속성창 크기 조정" aria-label="속성창 크기 조정"></div>
            <aside class="right-panel" aria-label="Project and properties">
                <section class="project-panel" aria-label="Project tree">
                    <div class="project-panel-title-row">
                        <div class="project-panel-title" data-i18n="project">프로젝트</div>
                        <button id="projectAddPageButton" class="project-panel-add-button" type="button" title="페이지 추가" aria-label="페이지 추가">+</button>
                    </div>
                    <div id="projectTree" class="project-tree" role="tree" aria-label="프로젝트 트리">
                        <div class="project-tree-root" role="treeitem">
                            <span class="project-tree-icon">▾</span>
                            <span class="project-tree-name">Project</span>
                        </div>
                        <div class="project-tree-page active" role="treeitem" aria-selected="true" tabindex="0" data-page-name="Page1">
                            <span class="project-tree-icon">□</span>
                            <span class="project-tree-name">Page1</span>
                        </div>
                    </div>
                </section>
                <div id="rightPanelSplitter" class="right-panel-splitter" title="프로젝트/속성 영역 크기 조정" aria-label="프로젝트/속성 영역 크기 조정"></div>
                <section class="property-panel" aria-label="Properties">
                    <div id="propertyPanelTitle" class="property-section-title" data-i18n="properties">속성</div>
                    <div class="property-content">
                        <table class="property-grid">
                            <tbody id="propertyGridBody">
                                <tr>
                                    <th>선택</th>
                                    <td>없음</td>
                                </tr>
                                <tr>
                                    <th>Name</th>
                                    <td>-</td>
                                </tr>
                                <tr>
                                    <th>Type</th>
                                    <td>-</td>
                                </tr>
                                <tr>
                                    <th>Address</th>
                                    <td>-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="linkPanelSplitter" class="link-panel-splitter" title="속성/링크 영역 크기 조정" aria-label="속성/링크 영역 크기 조정"></div>
                    <section id="linkPanel" class="link-panel" aria-label="Links">
                        <div class="link-panel-title">링크</div>
                        <div class="link-content">
                            <table class="property-grid link-grid">
                                <tbody>
                                    <tr>
                                        <th>Model</th>
                                        <td>
                                            <select id="linkModelSelect" class="property-select" aria-label="Link model">
                                                <option value="CUBLOC2" selected>CUBLOC2</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>Port</th>
                                        <td>
                                            <select id="linkTransportSelect" class="property-select" aria-label="Link transport">
                                                <option value="USB" selected>USB</option>
                                                <option value="COM">COM</option>
                                                <option value="Ethernet">Ethernet</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr id="linkComPortRow">
                                        <th>COM Port</th>
                                        <td>
                                            <select id="linkComPortSelect" class="property-select" aria-label="COM port">
                                                <option value="" selected>None</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr id="linkEthernetIpRow" style="display:none">
                                        <th>IP</th>
                                        <td>
                                            <input id="linkEthernetIpInput" class="property-input" type="text" value="192.168.0.100" />
                                        </td>
                                    </tr>
                                    <tr id="linkEthernetPortRow" style="display:none">
                                        <th>TCP Port</th>
                                        <td>
                                            <input id="linkEthernetPortInput" class="property-input" type="number" min="1" max="65535" value="502" />
                                        </td>
                                    </tr>
                                    <tr>
                                        <th>State</th>
                                        <td id="usbConnectionState" class="property-value">Disconnected</td>
                                    </tr>
                                    <tr>
                                        <th>Action</th>
                                        <td>
                                            <button id="usbConnectButton" class="toolbar-button" type="button" style="width:100%">Connect</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </section>
            </aside>
        </div>
    </div>
    <script src="visualization.js"></script>
    <script src="comfileweb.js"></script>
</body>
</html>
